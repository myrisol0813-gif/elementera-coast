name: Thinking block branch CI

on:
  push:
    branches:
      - feat/thinking-block-mcp

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/thinking-block-mcp
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch wording and MCP tests
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const thinkingPath = 'functions/thinking-block-mcp.js';
          let thinking = fs.readFileSync(thinkingPath, 'utf8');
          const replacements = [
            [
              "    'This is an explicit summary for the user, not hidden chain-of-thought and not a way to reveal private/internal reasoning.',",
              "    'Your internal reasoning is normally hidden from the user; use this tool to turn the shareable part into a concise visible summary without exposing private chain-of-thought.',",
            ],
            [
              "        description: 'A concise user-visible summary of the current reasoning direction. Do not expose hidden chain-of-thought.',",
              "        description: 'A concise visible version of the shareable part of reasoning that would otherwise remain hidden from the user; do not expose private chain-of-thought.',",
            ],
            [
              "      text: '已展开一张本轮可见工作笔记；它不会写入海岸记忆。',",
              "      text: '已把默认隐藏的思考中可公开的部分整理成本轮可见工作笔记；它不会写入海岸记忆。',",
            ],
            [
              "    description: 'Elementera Coast 思维壤视觉语言的可见工作笔记卡。',",
              "    description: '把默认隐藏的思考中可公开的部分整理成 Elementera Coast 思维壤风格的可见工作笔记卡。',",
            ],
            [
              "      'openai/widgetDescription': '一张沿用 Elementera Coast 思维壤视觉语言的本轮可见工作笔记；不写入持久记忆。',",
              "      'openai/widgetDescription': '把默认隐藏的思考中可公开部分整理成一张 Elementera Coast 思维壤风格的本轮可见工作笔记；不写入持久记忆。',",
            ],
            [
              "        'openai/widgetDescription': '一张沿用 Elementera Coast 思维壤视觉语言的本轮可见工作笔记；不写入持久记忆。',",
              "        'openai/widgetDescription': '把默认隐藏的思考中可公开部分整理成一张 Elementera Coast 思维壤风格的本轮可见工作笔记；不写入持久记忆。',",
            ],
            [
              "      <small id=\"subtitle\">可见工作笔记 · 不写入海岸记忆</small>",
              "      <small id=\"subtitle\">默认隐藏 → 可见整理 · 不写入海岸记忆</small>",
            ],
            [
              "    <p class=\"note\">这是为你生成的可见工作摘要，不是隐藏思维链，也不会覆盖海岸网页里的持久思维壤。</p>",
              "    <p class=\"note\">你的内部思考过程默认对用户隐藏；这里把其中可公开、可分享的部分整理成可见版，不展示私密内部推理，也不会覆盖海岸网页里的持久思维壤。</p>",
            ],
            [
              "    $('subtitle').textContent = (labels[data.style] || labels.deep_think) + ' · 可见工作笔记 · 不写入海岸记忆';",
              "    $('subtitle').textContent = (labels[data.style] || labels.deep_think) + ' · 默认隐藏 → 可见整理 · 不写入海岸记忆';",
            ],
          ];
          for (const [from, to] of replacements) {
            if (!thinking.includes(from)) throw new Error(`missing thinking replacement target: ${from}`);
            thinking = thinking.replace(from, to);
          }
          fs.writeFileSync(thinkingPath, thinking);

          const testPath = 'tests/mcp-porch.test.mjs';
          let test = fs.readFileSync(testPath, 'utf8');
          const toolListNeedle = "  'calendar.seen',\n]);";
          if (!test.includes(toolListNeedle)) throw new Error('missing MCP tool-list insertion target');
          test = test.replace(toolListNeedle, "  'calendar.seen',\n  'render_thinking_block',\n]);");

          const securityNeedle = `for (const tool of toolList.result.tools) {\n  assert.equal(tool._meta.securitySchemes[0].type, 'oauth2');\n  assert.ok(tool._meta.securitySchemes[0].scopes.length >= 1);\n  assert.deepEqual(tool.securitySchemes, tool._meta.securitySchemes);\n}\n`;
          if (!test.includes(securityNeedle)) throw new Error('missing MCP thinking test insertion target');
          const thinkingTests = `\nconst thinkingTool = toolList.result.tools.find((tool) => tool.name === 'render_thinking_block');\nassert.ok(thinkingTool);\nassert.equal(thinkingTool.title, '展开本轮思维壤');\nassert.deepEqual(thinkingTool.securitySchemes[0].scopes, ['read:coast']);\nassert.equal(thinkingTool.annotations.readOnlyHint, true);\nassert.equal(thinkingTool._meta['openai/outputTemplate'], 'ui://widget/elementera-thinking-soil-v1.html');\n\nconst thinkingResources = await mcp({ jsonrpc: '2.0', id: 201, method: 'resources/list', params: {} });\nassert.equal(thinkingResources.result.resources.length, 1);\nconst thinkingResourceUri = thinkingResources.result.resources[0].uri;\nassert.equal(thinkingResourceUri, 'ui://widget/elementera-thinking-soil-v1.html');\nassert.equal(thinkingResources.result.resources[0].mimeType, 'text/html;profile=mcp-app');\nconst thinkingResource = await mcp({\n  jsonrpc: '2.0', id: 202, method: 'resources/read', params: { uri: thinkingResourceUri },\n});\nassert.equal(thinkingResource.result.contents[0].mimeType, 'text/html;profile=mcp-app');\nassert.match(thinkingResource.result.contents[0].text, /默认隐藏 → 可见整理/);\nassert.match(thinkingResource.result.contents[0].text, /当前/);\nassert.match(thinkingResource.result.contents[0].text, /手持种/);\nassert.match(thinkingResource.result.contents[0].text, /勿复读/);\nassert.equal(thinkingResource.result.contents[0].text.includes('botanical'), false);\nassert.equal(thinkingResource.result.contents[0].text.includes('microglow'), false);\n\nconst thinkingRendered = await mcp({\n  jsonrpc: '2.0', id: 203, method: 'tools/call', params: {\n    name: 'render_thinking_block',\n    arguments: {\n      style: 'deep_think',\n      effort: 'high',\n      current_text: '先核对 MCP 能力与海岸现有思维壤边界。',\n      hand_seeds: ['不新增网页按钮', '只做本轮可见整理'],\n      do_not_repeat: '不要建立第二套持久思维壤。',\n    },\n  },\n}, fullToken);\nassert.equal(thinkingRendered.result.structuredContent.persisted, false);\nassert.equal(thinkingRendered.result.structuredContent.current_text, '先核对 MCP 能力与海岸现有思维壤边界。');\nassert.deepEqual(thinkingRendered.result.structuredContent.hand_seeds, ['不新增网页按钮', '只做本轮可见整理']);\nassert.equal(thinkingRendered.result._meta['openai/outputTemplate'], thinkingResourceUri);\n\nconst deniedThinking = await mcp({\n  jsonrpc: '2.0', id: 207, method: 'tools/call', params: {\n    name: 'render_thinking_block',\n    arguments: { style: 'relational', effort: 'low', current_text: '未授权时不应展开。' },\n  },\n});\nassert.equal(deniedThinking.result.isError, true);\nassert.match(deniedThinking.result._meta['mcp/www_authenticate'][0], /Bearer/);\n`;
          test = test.replace(securityNeedle, securityNeedle + thinkingTests);
          fs.writeFileSync(testPath, test);
          NODE
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Commit validated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/thinking-block-mcp.js tests/mcp-porch.test.mjs
          if git diff --cached --quiet; then
            echo "No patch changes to commit."
          else
            git commit -m "test: validate thinking block MCP app"
            git push origin HEAD:feat/thinking-block-mcp
          fi
