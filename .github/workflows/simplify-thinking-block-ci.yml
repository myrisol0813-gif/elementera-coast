name: Simplify thinking block CI

on:
  push:
    branches:
      - simplify/thinking-block-single-tool

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: simplify/thinking-block-single-tool
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collapse thinking block to one canonical tool
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const replaceOnce = (text, from, to, label) => {
            if (text.includes(to) && !text.includes(from)) return text;
            if (!text.includes(from)) throw new Error(`missing target: ${label}`);
            return text.replace(from, to);
          };

          const thinkingPath = 'functions/thinking-block-mcp.js';
          let thinking = fs.readFileSync(thinkingPath, 'utf8');
          thinking = thinking.replace(
            "export const THINKING_BLOCK_TOOL_NAME = 'render_official_app_thinking_soil';",
            "export const THINKING_BLOCK_TOOL_NAME = 'render_thinking_block';",
          );
          fs.writeFileSync(thinkingPath, thinking);

          const routerPath = 'functions/mcp-router.js';
          let router = fs.readFileSync(routerPath, 'utf8');
          router = router.replace("\nconst LEGACY_THINKING_BLOCK_TOOL_NAME = 'render_thinking_block';\n", '\n');
          router = router.replace(
            "    const result = (params.name === THINKING_BLOCK_TOOL_NAME || params.name === LEGACY_THINKING_BLOCK_TOOL_NAME)\n      ? await callThinkingBlockTool(params.arguments, request, env)",
            "    const result = params.name === THINKING_BLOCK_TOOL_NAME\n      ? await callThinkingBlockTool(params.arguments, request, env)",
          );
          fs.writeFileSync(routerPath, router);

          const testPath = 'tests/mcp-porch.test.mjs';
          let test = fs.readFileSync(testPath, 'utf8');
          test = test.replace("  'render_official_app_thinking_soil',", "  'render_thinking_block',");
          test = test.replace(
            "const thinkingTool = toolList.result.tools.find((tool) => tool.name === 'render_official_app_thinking_soil');\nassert.ok(thinkingTool);\nassert.equal(toolList.result.tools.some((tool) => tool.name === 'render_thinking_block'), false);",
            "const thinkingTool = toolList.result.tools.find((tool) => tool.name === 'render_thinking_block');\nassert.ok(thinkingTool);",
          );
          test = test.replace(/name: 'render_official_app_thinking_soil'/g, "name: 'render_thinking_block'");
          test = test.replace(/\nconst legacyThinkingRendered = await mcp\(\{[\s\S]*?assert\.equal\(legacyThinkingRendered\.result\._meta\['openai\/outputTemplate'\], thinkingResourceUri\);\n/, '\n');
          fs.writeFileSync(testPath, test);
          NODE
      - name: Verify single-tool shape
        run: |
          grep -q "THINKING_BLOCK_TOOL_NAME = 'render_thinking_block'" functions/thinking-block-mcp.js
          ! grep -q "render_official_app_thinking_soil" functions/thinking-block-mcp.js
          ! grep -q "LEGACY_THINKING_BLOCK_TOOL_NAME" functions/mcp-router.js
          ! grep -q "render_official_app_thinking_soil" tests/mcp-porch.test.mjs
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Commit validated simplification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/thinking-block-mcp.js functions/mcp-router.js tests/mcp-porch.test.mjs
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "refactor: keep one thinking block tool"
          git push origin HEAD:simplify/thinking-block-single-tool
